display_name: spec-driven-development
description: Creates specs before coding. Use when starting a new project, feature,
  or significant change and no specification exists yet. Use when drafting a PRD or
  requirements document with objectives and scope, or when requirements are unclear,
  ambiguous, or only exist as a vague idea. Use when a single requirement spans several
  independently testable capabilities and needs decomposing into a capability map
  of modules before specifying.
