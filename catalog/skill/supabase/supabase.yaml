  debugging and troubleshooting errors or unexpected behavior on Supabase projects
  (HTTP errors, Postgres errors, RLS surprises, permission denied, schema cache issues,
  timeouts, Edge Function crashes, Realtime drops, Storage failures) and reading or
  querying logs (Logs Explorer, ClickHouse).'
