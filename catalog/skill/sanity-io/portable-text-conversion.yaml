display_name: portable-text-conversion
description: Convert HTML and Markdown content into Portable Text blocks for Sanity.
  Use when migrating content from legacy CMSs, importing HTML or Markdown into Sanity,
  building content pipelines that ingest external content, converting rich text between
  formats, or programmatically creating Portable Text documents. Covers @portabletext/markdown
  (markdownToPortableText), @portabletext/block-tools (htmlToBlocks), custom deserializers,
  and the Portable Text specification for manual block construction.
