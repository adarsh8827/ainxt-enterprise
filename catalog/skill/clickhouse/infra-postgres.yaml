description: "Sets up and manages Postgres using the clickhousectl CLI \u2014 runs\
  \ a local Docker-backed Postgres for development, and creates and operates managed\
  \ ClickHouse Cloud Postgres services (connections, TLS, runtime config, read replicas,\
  \ failover, point-in-time restore). Use when the user wants a Postgres or PostgreSQL\
  \ database for their application, a local Postgres dev environment, psql access,\
  \ or a managed/production Postgres in ClickHouse Cloud, or mentions moving a local\
  \ Postgres to production."
