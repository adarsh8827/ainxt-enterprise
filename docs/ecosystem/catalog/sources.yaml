    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). First-party product skills for Terra's health/fitness-data API; using them for real needs a Terra account. 9/9 skills pass the real neutrality scanner."

  - repo: hookdeck/agent-skills
    category: engineering
    tags: [hookdeck, webhooks, event-gateway]
    needs_product: Hookdeck
