      - skills/python-refactor-audit
      - skills/python-testing-conventions-taudelta
      - skills/repo-pitch
      - skills/research-library
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). Only 7/15 skills pass the real neutrality scanner -- the other 8 explicitly read a specific external coding-agent CLI's own session/transcript/config conventions throughout their body text. Scoped to exactly the 7 verified-clean paths above via include_paths rather than relying on the automatic per-item filter, given how thoroughly vendor-specific the rest of the repo is."

  - repo: K-Dense-AI/scientific-agent-skills
    category: research
    tags: [science, bioinformatics, research-tools]
    tos_note: "Public GitHub repo; license is LICENSE.md (not a root LICENSE file), fetched directly and confirmed to be real, complete MIT text -- GitHub's own license-detection API independently agrees (MIT). 134/166 skills pass the real neutrality scanner; the 32 that don't mostly name a third-party model/platform (Hugging Face, Llama, Gemini, GPT/OpenAI, Claude/Anthropic, DeepSeek, Qwen, Windsurf, Grok) as their actual subject matter, caught automatically per item at crawl time. Several skills bundle scripts -- route through sandbox on install, same as any other scripted skill."

  - repo: Orchestra-Research/AI-Research-SKILLs
    category: research
    tags: [ml-research, training, evaluation]
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). Only 21/98 skills pass the real neutrality scanner -- most of this repo is organized one skill per ML framework/model (Llama, Qwen, DeepSeek, OpenAI, Anthropic, Hugging Face, etc.), so most individual skills legitimately name a vendor/model as their own subject matter and fail the scanner by design; caught automatically per item at crawl time. The 21 that pass include real research-infra value (mamba, rwkv, axolotl, ray-data, accelerate, pytorch-fsdp2, pytorch-lightning, mlflow, swanlab, tensorboard, weights-and-biases, faiss, pinecone, qdrant, openpi, openvla-oft, stable-diffusion, presenting-conference-talks, systems-paper-writing, brainstorming-research-ideas, research-manager). Several skills bundle scripts -- route through sandbox on install, same as any other scripted skill."

  - repo: nexu-io/open-design
    category: design
    tags: [design, prototyping, templates]
    include_paths:
      - skills
      - design-templates
    tos_note: "Public GitHub repo, Apache-2.0 (repo-root LICENSE, confirmed via direct fetch). 540 SKILL.md files repo-wide, but 257 live under plugins/ and 1 under .claude/ -- both structurally organized as a specific coding-agent CLI's own plugin-marketplace layout (the repo's own description literally reads 'the open-source Claude Design alternative' / 'Claude Code / Codex / Cursor / DeepSeek Harness / OpenCode & 20+ CLIs'), excluded wholesale via include_paths rather than left to the per-item filter since the concern is structural, not per-skill content. Scoped to skills/ + design-templates/ = 277 files: 235/277 pass the real neutrality scanner; the 42 that don't (mostly Claude/Anthropic/OpenAI/Gemini/Copilot named directly in individual design templates) are caught automatically per item at crawl time. Has scripts in places -- route through sandbox on install."

github_topic_searches:
  # Discovery-only: surfaces CANDIDATE repos for a maintainer to review
  # and add to github_repos above via a reviewed PR. Never auto-added to
  # the catalog by the crawler itself -- see plan §3.
  - topic: agent-skills
    tos_note: "GitHub code/repo search API, anonymous-capable (lower rate limit without a configured instance token). Read-only, discovery-only."

well_known_sites:
  # Both verified live (2026-09-28) to publish a real index at the modern
  # path (schemas.agentskills.io/discovery/0.2.0) that this adapter's
  # CURRENT parser (rewritten the same day, after the original guessed
  # shape was found not to match) can actually read -- see
  # services/ecosystem/import_adapters/well_known.py's own header.
  - domain: docs.x.com
    category: engineering
    tags: [api]
    test_source: true   # verifies the well-known adapter against a real site; its one entry has no license anyway (see the tos_note) so it never contributes a real catalog item
    tos_note: "Publishes /.well-known/agent-skills/index.json (modern format) and /.well-known/skills/index.json (legacy format) at its own public domain, no auth. The one real entry found (\"x\") has no license: field in its SKILL.md -- correctly excluded by the license check, not an error in the source listing. Kept in this file as a test source: it's a real, live, known-shape /.well-known index to verify the adapter against, not expected to ever contribute a catalog item."

  - domain: supabase.com
    category: engineering
    tags: [supabase, postgres]
    tos_note: "Publishes /.well-known/agent-skills/index.json (modern format, archive-type entries pointing at GitHub release assets), no auth. Entries carry an MIT license: field."

mcp_registry:
  enabled: true
  max_pages: 20
  tos_note: "Official MCP Registry (https://registry.modelcontextprotocol.io), API v0.1, public and unauthenticated. Crawled and stored as mcp_server pointer entries, but hidden in the UI until the mcp_server item type itself ships (ECOSYSTEM_TYPE_MCP is coming_soon) -- see docs/ecosystem/EXTERNAL_SOURCES_PLAN.md §3."

# Connectors+Plugins phase, Stage 5 (2026-09-30) -- hand-picked ("original-
# author") MCP server repos, reviewed and approved per
# docs/ecosystem/catalog/stage5-sources-candidates.md §a/§c. Both licenses
# verified directly via the GitHub API's license.spdx_id (no text-guess
# fallback needed for either).
mcp_server_repos:
  - repo: github/github-mcp-server
    category: dev-tools
    tags: [github, official]
    tos_note: "MIT. Talks to the real GitHub API under the caller's own token/scopes. GitHub's API Terms of Service (docs.github.com/site-policy/github-terms/github-terms-of-service) + Acceptable Use Policy: token may not be shared with a third party, must be the caller's own sole means of access; standard AUP restrictions apply (no spam/scraping-for-resale). No clause specific to AI/agentic use found."

  - repo: cloudflare/mcp-server-cloudflare
    category: dev-tools
    tags: [cloudflare, official]
    tos_note: "Apache-2.0. Talks to the Cloudflare API under the caller's own account/token. Cloudflare's Self-Serve Subscription Agreement (API/SDK terms): may not use the API to damage/disable/overburden/circumvent rate limits on Cloudflare's servers; app-platform developers must cooperate on a \"technical solution\" for user provisioning. No AI-specific restriction found."

# Connectors+Plugins phase, Stage 5 (2026-09-30) -- Activepieces
# (github.com/activepieces/activepieces) community pieces, reviewed and
# approved per docs/ecosystem/catalog/stage5-sources-candidates.md §b/§c.
# One block per piece (not grouped) so each piece's own, distinct,
# real ToS finding stays accurately attributed -- a single shared
# tos_note across multiple pieces would blur genuinely different
# service terms together. License for every piece here is MIT via the
# Activepieces repo-ROOT LICENSE (packages/ee/ never applies to a
# community piece -- see ActivepiecesSource's own docstring in
# sources_config.py); GitHub's API misreports the repo's license as
# "other"/NOASSERTION, not used here.
#
# `slack` is DELIBERATELY EXCLUDED from this list -- its own API Terms of
# Service (real, cited 2025 policy change) prohibit using data accessed
# via the Slack API to train LLMs, prohibit bulk data export, and require
# distribution through the Slack Marketplace or a direct Slack/Salesforce
# partner agreement. This platform is an AI product; approving `slack`
# needs a real legal read, not just this license/ToS pass -- see
# stage5-sources-candidates.md §c row 1 for the full finding. Do not add
# it here without that review.
activepieces:
  - pieces: [airtable]
    category: productivity
    tos_note: "Airtable Developer Terms: may not rent/sell user Data to third parties or use it to build/modify user profiles beyond what the integration itself needs; OAuth integrations let the end user revoke access at any time; developer is solely responsible for legal/privacy compliance of the integration."

  - pieces: [asana]
    category: productivity
    tos_note: "Asana API Terms (asana.com/terms/api-terms): license to use the API is non-exclusive, revocable, non-transferable; submitting an \"App Component\" grants Asana a license to display/promote it and subjects it to an Asana security review; access tokens must be revoked and Asana Marks removed on termination."

  - pieces: [algolia]
    category: dev-tools
    tos_note: "Algolia's terms/AUP center on rate limits and per-plan quotas (e.g. Free plan: 10,000 search requests/month, 1 GB index) enforced via API-key restrictions; SLA explicitly does not cover unavailability caused by non-conforming use. No data-training/resale-specific clause found."

  - pieces: [amazon-s3]
    category: dev-tools
    tos_note: "AWS Service Terms/Customer Agreement: customer is responsible for all activity under their account including third-party/agent actions; customer content must comply with AWS's Acceptable Use Policy; AWS disclaims responsibility for third-party content accessed through the account. Generic account-holder-liability shape, nothing S3-specific beyond that."

  - pieces: [azure-blob-storage]
    category: dev-tools
    tos_note: "Could not find a Blob-Storage-specific third-party-developer clause distinct from the general Microsoft APIs Terms of Use / Microsoft Customer Agreement (Microsoft may change/discontinue API availability at its discretion; standard MCA/MOSA terms govern the underlying Azure subscription). Real but incomplete finding -- flagged, not a full clearance."

  - pieces: [apitable]
    category: productivity
    tos_note: "Could not verify a specific published API Terms of Service page for the Apitable/APITable service itself -- search surfaced only its own open-source licensing model (open-core: core MIT, premium/enterprise directories under separate paid licenses), which describes the target service's own code, not a usage ToS. Flagged as unverified rather than guessed."

  - pieces: [baserow]
    category: productivity
    tos_note: "Baserow General Terms and Conditions exist (baserow.io/terms-and-conditions) but specific API-usage clauses were not extracted beyond confirming the page exists. Baserow itself is open-core -- core platform MIT-licensed, premium/enterprise directories separately/proprietarily licensed (context, not a usage-ToS finding)."

  - pieces: [bannerbear]
    category: productivity
    tos_note: "Bannerbear Terms and Conditions (bannerbear.com/terms): standard account/content terms (must be 18+, content license grant back to Bannerbear for content you post, 30 days' notice for material term changes). No API-specific or AI-specific clause found beyond the general terms."

  - pieces: [ashby]
    category: productivity
    tos_note: "Ashby's published terms are its Customer Terms of Service (ashbyhq.com/resources/terms) plus a separate \"Terms for AI Features\" page (confirms Ashby itself has AI-specific terms, relevant context) -- both confirmed to exist and be real; API-specific integration clauses distinct from the general customer terms were not extracted."

  - pieces: [attio]
    category: productivity
    tos_note: "Attio Developer Terms (attio.com/legal/attio-developer-terms) is a real, dedicated developer/API agreement (distinct from its general Terms and Conditions) governing App SDK licensing and API-app authentication -- confirmed to exist and cover exactly this integration shape, though not every clause was extracted."

  - pieces: [appfollow]
    category: dev-tools
    tos_note: "AppFollow Terms and Conditions (get.appfollow.io/terms) plus real, specific rate limits: 1,000 requests/hour per token, 10,000 requests/hour per account, monthly credit reset. The clearest quota data found of any of the 14 Stage 5 candidates."

# Caps that stop a single crawl from growing the catalog unbounded.
# Exceeding either is reported (the crawl report's "Over cap" section),
# never a silent truncation. The crawl workflow itself runs daily
# (.github/workflows/ecosystem-catalog-crawl.yml's cron) -- these limits
# bound each individual run, not how often it happens.
crawl_limits:
  # Raised from 50 to 300 in the 2026-09-29 round-2 widening: the largest
  # in-scope repo added that round is nexu-io/open-design's 277-file
  # scoped total (skills/ + design-templates/ only), next largest is
  # K-Dense-AI/scientific-agent-skills's 166 -- 300 fits both with
  # headroom without being large enough to defeat the cap's purpose.
  max_skills_per_repo: 300
  max_total_items: 10000
