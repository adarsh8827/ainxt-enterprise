# External sources catalog crawl allowlist (docs/ecosystem/EXTERNAL_SOURCES_PLAN.md §1, §7).
#
# STOP POINT 1 ARTIFACT -- for review before any real crawl runs. Changes
# to this file go through a normal reviewed PR (§7); the crawl workflow
# itself never edits it. Every source below is real (checked directly,
# 2026-09-28) and was already reviewed for MIT/Apache-2.0 licensing and
# neutrality during the starter-catalog scan
# (docs/ecosystem/catalog/starter-approved.md, docs/ecosystem/catalog/
# starter-candidates.md) -- this file only re-lists the ones judged safe
# to crawl on an ongoing basis, not a re-scan.
#
# What each entry buys: a repo/site/registry the crawler is ALLOWED to
# walk. It is NOT a guarantee every item found there ends up in the
# catalog -- the crawler still runs the same per-item Tier-1 license
# check and fast safety scan as everywhere else, and the full 7-stage
# gate still runs again at install time. An excluded item is logged in
# the crawl report (stop point 2), never listed.
#
# Deliberately NOT in this file, with reasons (per the External sources
# plan's own exclusion rules and the prior starter-catalog scan):
#   - ClawHub, and anything published there (tenequm/skills,
#     nanocoai/nanoclaw) -- excluded outright, never a source.
#   - Aggregator/"awesome"-list repos generally (several exist, curating
#     links to other repos) -- discovery-only for a human, never crawled
#     directly.
#   - The reference-design project's own bundled skills repo -- excluded
#     outright (source of the very platform this design deliberately
#     avoids naming).
#   - hashicorp/agent-skills (MPL-2.0), yusukebe/skills (no license
#     anywhere in the repo), flutter/agent-plugins (BSD-3-Clause) -- fail
#     tier-1 licensing regardless of content quality.
#   - K-Dense-AI/scientific-agent-skills, Orchestra-Research/AI-Research-SKILLs
#     -- too specialized for this catalog (prior explicit review decision).
#   - vercel-labs/agent-skills -- MIT-clean content, but the owner name
#     itself is a vendor name; held for a maintainer decision rather than
#     auto-included.
#   - nidhinjs/prompt-master -- likely the one candidate excluded from
#     the original starter-catalog import batch for naming specific AI
#     products/vendors throughout its content (starter-approved.md's own
#     note); held pending a fresh per-file check before it's added back.
#   - TheodoreAD/agent-skills -- most of its content explicitly reads a
#     specific external coding-agent CLI's own transcript store/config
#     paths; one skill (python-refactor-audit) looked clean on inspection
#     but its exact subdirectory path wasn't independently re-verified for
#     this file -- held pending that, rather than crawling the whole repo.
#   - expo/skills, tryterra/agent-skills, hookdeck/agent-skills,
#     nexu-io/open-design -- single-vendor-account-locked (Terra/Hookdeck)
#     or too large to scan without a path-scoped follow-up
#     (nexu-io: 537 SKILL.md files, over the discovery cap); candidates
#     for a later catalog-only (non-starter) addition, not included yet.
#   - googleworkspace/cli -- needs an external CLI/account; held for later.
#   - A generic "plugin marketplace manifest" source type -- out of scope
#     for this phase entirely (Plugins phase).
#
# Candidate-source evaluation round (2026-09-29, per an explicit request to
# check contextosai/skills, tawanorg/skills, KraitDev/skiLL.Md, MaxSchoon/
# ixbrl, siesdart/skills, vythanhtra/perplexity-skills for per-skill license
# + neutrality + provenance before adding anything). Two added below
# (siesdart/skills, contextosai/skills); four excluded, itemized per skill
# since none of them survive even partially:
#   - tawanorg/skills -- does not exist (404; confirmed absent across all
#     100 of that GitHub user's public repos). Nothing to evaluate.
#   - KraitDev/skiLL.Md -- MIT, but ALL 14 skills fail neutrality: every
#     single one carries `compatible_agents: [claude-code, cursor, copilot,
#     codex]` in its own frontmatter, naming specific AI
#     products/vendors (caching-strategies, event-driven-design,
#     logging-observability-standards, api-design-rest,
#     database-query-optimization, error-handling-architecture,
#     code-review-guidelines, ci-cd-pipeline-architecture,
#     debugging-strategies, git-workflow-branching,
#     dom-security-hardening, react-component-design,
#     state-management-patterns, accessibility-ui-design). 14/14 excluded,
#     no path scoping salvages this -- the violation is on every file.
#   - MaxSchoon/ixbrl -- its one skill (iXBRL/SOX-filing tooling) fails
#     license: the repo's code is Apache-2.0, but the SKILL.md/references/
#     assets content itself is explicitly declared CC BY 4.0 (`license: see
#     NOTICE`, confirmed in the repo's own README/frontmatter) -- not
#     MIT/Apache-2.0-compatible regardless of the code license. Excluded.
#   - vythanhtra/perplexity-skills -- all 10 skills excluded: no LICENSE
#     file anywhere in the repo (GitHub's own license API confirms none
#     detected), AND every skill's frontmatter carries `author: Perplexity`
#     (a named AI vendor) -- create-skill, cx-ticket-triage,
#     data-exploration, finance-audit-support, legal-compliance,
#     legal-contract-review, marketing-competitive-analysis, meeting-prep,
#     research-summarization, sales-prospecting. License failure alone is
#     disqualifying; didn't need to reach the neutrality question.
# Also checked, discovery-only per instruction, not itself a source:
#   - coppermare/skillverse -- confirmed the aggregator already excluded
#     above by name. Its Enterprise/Finance/Business-Analytics entries all
#     trace back to wshobson/agents (already an approved source below) via
#     its own per-skill ATTRIBUTION.md files -- nothing new to add from it.

github_repos:
  - repo: siesdart/skills
    category: engineering
    tags: [architecture, refactoring, flutter, react, typescript]
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). Individual-maintainer repo. 7/7 skills pass the real neutrality scanner. improve-folder-architecture is openly adapted from mattpocock/skills' improve-codebase-architecture (already an approved MIT source below) -- disclosed in the repo's own THIRD-PARTY-NOTICES.md with the upstream MIT notice preserved verbatim, not a hidden copy. flutter-apply-architecture-best-practices only cites Flutter's own public docs (docs.flutter.dev) as reference material in its REFERENCE.md 'Sources' section -- informational citation of public documentation, not reuse of a separately-licensed 'Flutter skill' (no such thing was found to exist); confirmed no attribution notice for it exists in THIRD-PARTY-NOTICES.md because none is needed."

  - repo: contextosai/skills
    category: engineering
    tags: [architecture, code-review, documentation, incident-response, refactoring]
    exclude_paths:
      # Not a real skill -- a scaffold/starter template whose own content
      # names an AI vendor throughout (fails the neutrality scanner);
      # excluding it costs nothing since it was never meant to be used as-is.
      - template
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). 19/20 skills pass the real neutrality scanner (excluding template/SKILL.md above). Individual-maintainer repo. Caveat, not blocking: the repo's own README (not the SKILL.md files this crawler actually ingests) has vendor-specific install instructions for two named coding-agent CLIs' own plugin-marketplace mechanisms -- doesn't affect what gets indexed, flagged for a maintainer's own awareness."
  - repo: addyosmani/agent-skills
    category: engineering
    tags: [code-review, testing, documentation, planning]
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE), no account or API key needed to read via the GitHub REST API. Individual-maintainer repo, not a vendor."

  - repo: mattpocock/skills
    category: engineering
    tags: [debugging, refactoring, tdd]
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). Individual-maintainer repo. Several skills reference a specific external coding-agent CLI's own instructions-file naming convention in their body text -- caught per-item by the neutrality/fast-safety checks at crawl time (and the full ethics gate at install time), not excluded from crawling here."

  - repo: wshobson/agents
    category: engineering
    tags: [incident-response, sql, code-review]
    exclude_paths:
      # Legal/compliance-template content -- flagged for a closer
      # originality/copyright check the automated gate doesn't perform
      # (it checks license grants and safety, not whether the prose
      # itself was copied from an uncredited template). Excluded from
      # crawling rather than left to a check that can't catch this.
      # Paths confirmed via a real clone of the repo, 2026-09-28.
      - plugins/hr-legal-compliance/skills/gdpr-data-handling
      - plugins/hr-legal-compliance/skills/employment-contract-templates
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). Individual-maintainer repo, largest/most diverse pool of the sources reviewed."

  - repo: DeanThompson/agent-skills
    category: engineering
    tags: [git, agent-context]
    tos_note: "Public GitHub repo, MIT (SKILL.md license field on the skills reviewed). Individual-maintainer repo."

  - repo: ClickHouse/agent-skills
    category: engineering
    tags: [clickhouse, sql, database]
    needs_product: ClickHouse
    tos_note: "Public GitHub repo, Apache-2.0. First-party product skills (ClickHouse's own). No account needed to read the repo; skills themselves assume ClickHouse is already in use."

  - repo: cloudflare/skills
    category: engineering
    tags: [cloudflare, workers, edge]
    needs_product: Cloudflare
    tos_note: "Public GitHub repo, Apache-2.0. First-party product skills (Cloudflare Workers/Wrangler/Durable Objects). No account needed to read the repo."

  - repo: cloudflare/security-audit-skill
    category: security
    tags: [security, audit]
    tos_note: "Public GitHub repo, MIT. Description reads as generic (not Cloudflare-product-specific) despite the org; has 19 bundled files, review each at crawl/gate time."

  - repo: supabase/agent-skills
    category: engineering
    tags: [supabase, postgres]
    needs_product: Supabase
    tos_note: "Public GitHub repo, MIT. First-party product skills; one (supabase-postgres-best-practices) may be broadly Postgres-relevant beyond Supabase itself."

  - repo: sanity-io/agent-toolkit
    category: engineering
    tags: [sanity, cms]
    needs_product: Sanity
    account_required: true
    tos_note: "Public GitHub repo, MIT. First-party CMS product skills; using them for real needs a Sanity project/account."

  - repo: greensock/gsap-skills
    category: engineering
    tags: [gsap, animation, frontend]
    needs_product: GSAP
    tos_note: "Public GitHub repo, MIT. Library-specific (npm install only, no account needed) -- broadly usable by any frontend team already using GSAP."

  - repo: google-labs-code/stitch-skills
    category: design
    tags: [design, stitch]
    needs_product: Stitch
    account_required: true
    tos_note: "Public GitHub repo, Apache-2.0. First-party design-tool skills; some (e.g. upload-to-stitch) need a Stitch account -- compatibility/gate handles that per item, not excluded from the source."

github_topic_searches:
  # Discovery-only: surfaces CANDIDATE repos for a maintainer to review
  # and add to github_repos above via a reviewed PR. Never auto-added to
  # the catalog by the crawler itself -- see plan §3.
  - topic: agent-skills
    tos_note: "GitHub code/repo search API, anonymous-capable (lower rate limit without a configured instance token). Read-only, discovery-only."

well_known_sites:
  # Both verified live (2026-09-28) to publish a real index at the modern
  # path (schemas.agentskills.io/discovery/0.2.0) that this adapter's
  # CURRENT parser (rewritten the same day, after the original guessed
  # shape was found not to match) can actually read -- see
  # services/ecosystem/import_adapters/well_known.py's own header.
  - domain: docs.x.com
    category: engineering
    tags: [api]
    test_source: true   # verifies the well-known adapter against a real site; its one entry has no license anyway (see the tos_note) so it never contributes a real catalog item
    tos_note: "Publishes /.well-known/agent-skills/index.json (modern format) and /.well-known/skills/index.json (legacy format) at its own public domain, no auth. The one real entry found (\"x\") has no license: field in its SKILL.md -- correctly excluded by the license check, not an error in the source listing. Kept in this file as a test source: it's a real, live, known-shape /.well-known index to verify the adapter against, not expected to ever contribute a catalog item."

  - domain: supabase.com
    category: engineering
    tags: [supabase, postgres]
    tos_note: "Publishes /.well-known/agent-skills/index.json (modern format, archive-type entries pointing at GitHub release assets), no auth. Entries carry an MIT license: field."

mcp_registry:
  enabled: true
  max_pages: 20
  tos_note: "Official MCP Registry (https://registry.modelcontextprotocol.io), API v0.1, public and unauthenticated. Crawled and stored as mcp_server pointer entries, but hidden in the UI until the mcp_server item type itself ships (ECOSYSTEM_TYPE_MCP is coming_soon) -- see docs/ecosystem/EXTERNAL_SOURCES_PLAN.md §3."

# Caps that stop a single crawl from growing the catalog unbounded.
# Exceeding either is reported (the crawl report's "Over cap" section),
# never a silent truncation. The crawl workflow itself runs daily
# (.github/workflows/ecosystem-catalog-crawl.yml's cron) -- these limits
# bound each individual run, not how often it happens.
crawl_limits:
  max_skills_per_repo: 50
  max_total_items: 10000
