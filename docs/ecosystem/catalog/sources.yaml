  - repo: googleworkspace/cli
    category: engineering
    tags: [google-workspace, cli, productivity]
    needs_product: "Google Workspace"
    account_required: true
    tos_note: "Public GitHub repo, Apache-2.0 (repo-root LICENSE). First-party CLI skills; using them for real needs the googleworkspace CLI and a Google account. 95/95 skills pass the real neutrality scanner -- the cleanest source in this round."

  - repo: TheodoreAD/agent-skills
    category: engineering
    tags: [python, mcp, conventions]
    include_paths:
