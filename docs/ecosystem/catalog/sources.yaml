  - repo: expo/skills
    category: engineering
    tags: [expo, react-native, mobile]
    needs_product: Expo
    tos_note: "Public GitHub repo, MIT (repo-root LICENSE). First-party product skills. 22/26 skills pass the real neutrality scanner; the 4 that don't (.claude/skills/expo-skill-eval, plugins/expo/skills/eas-hosting, plugins/expo/skills/expo-examples, plugins/expo/skills/expo-project-structure) are caught by the same per-item check at crawl time, not pre-excluded here."

  - repo: tryterra/agent-skills
