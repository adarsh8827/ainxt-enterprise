<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ainxt — Customize (mock)</title>
<style>
:root{
  --bg:#f8f7f4;--panel:#fff;--sb:#f1efea;--text:#1f1e1c;--muted:#6d6b66;--faint:#9a978f;
  --border:#e4e1da;--hover:#ece9e2;--accent:#1f4d43;--accent2:#e3efe9;--hero:#dfe9e2;
  --warn:#9a6700;--warnbg:#fff4d6;--bad:#b42318;--badbg:#fdecea;--ok:#1a7f4b;--okbg:#e5f5ec;
  --info:#2d5bb9;--infobg:#e8effc;--r:12px;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
/* sidebar */
.sb{width:260px;background:var(--sb);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:22px;letter-spacing:-.5px;padding:4px 10px 18px}
.logo span{color:var(--accent)}
.nav a{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--hover);font-weight:600}
.nav svg{width:19px;height:19px}
.sbh{color:var(--muted);font-size:13px;margin:22px 10px 6px}
.rec{padding:6px 10px;color:var(--text);font-size:14px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec:hover{background:var(--hover)}
.me{margin-top:auto;border-top:1px solid var(--border);padding:12px 10px 0;display:flex;gap:10px;align-items:center;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;background:#d9d5cc;display:grid;place-items:center;font-weight:600;font-size:13px}
/* main */
main{flex:1;min-width:0;padding:44px 56px 80px;max-width:1360px}
h1{font-size:34px;font-weight:600;letter-spacing:-.6px;margin:0 0 26px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:26px}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--muted);font-size:16px}
.tab:hover{color:var(--text)}
.tab.on{background:var(--hover);color:var(--text);font-weight:600}
.vsep{width:1px;height:26px;background:var(--border);margin:0 4px}
.seg{display:flex;background:var(--hover);padding:3px;border-radius:10px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;color:var(--muted);font-size:15px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:8px 12px;min-width:260px}
.search input{border:0;outline:0;font:inherit;flex:1;background:none}
.search svg{width:17px;height:17px;color:var(--muted)}
.ib{border:1px solid transparent;background:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;position:relative}
.ib:hover{background:var(--hover)}
.ib svg{width:19px;height:19px}
.ib .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.primary{background:var(--text);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;display:flex;gap:8px;align-items:center}
.primary:hover{opacity:.9}
.primary[disabled]{background:#c8c5bd;cursor:not-allowed}
.ghost{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-weight:500}
.ghost:hover{background:var(--hover)}
.link{background:none;border:0;color:var(--text);display:inline-flex;gap:6px;align-items:center;font-size:15px;padding:0}
.link:hover{text-decoration:underline}
/* hero */
.hero{background:var(--hero);border-radius:18px;padding:34px 36px;display:flex;align-items:center;gap:24px;margin-bottom:40px}
.hero .lab{font-size:14px;color:#44544d}
.hero h2{font-size:30px;margin:6px 0 8px;letter-spacing:-.4px}
.hero p{margin:0 0 20px;color:#34413b;font-size:16px}
.hero .art{margin-left:auto;width:150px;height:110px;color:#1f2d27;flex:none}
/* sections */
.sh{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}
.sh h3{margin:0;font-size:18px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:36px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;gap:14px;cursor:pointer;position:relative;transition:box-shadow .15s,border-color .15s}
.card:hover{border-color:#cfcbc2;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ic{width:52px;height:52px;border-radius:12px;border:1px solid var(--border);background:#faf9f6;display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.cb{min-width:0;flex:1;padding-right:36px}
.ct{font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cd{color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{color:var(--faint);font-size:13.5px;margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plus{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--panel);display:grid;place-items:center;font-size:20px;line-height:1}
.plus:hover{background:var(--hover)}
.plus.done{background:var(--accent2);border-color:#bcd8cc;color:var(--accent);font-size:15px}
.plus[disabled]{color:var(--bad);cursor:not-allowed}
/* badges */
.b{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--hover);color:var(--muted);white-space:nowrap}
.b.new{background:var(--infobg);color:var(--info)}
.b.builtin{background:var(--accent2);color:var(--accent)}
.b.verified{background:var(--infobg);color:var(--info)}
.b.org{background:#efe8fb;color:#6a3fb5}
.b.community{background:var(--hover);color:var(--muted)}
.b.warn{background:var(--warnbg);color:var(--warn)}
.b.bad{background:var(--badbg);color:var(--bad)}
.b.ok{background:var(--okbg);color:var(--ok)}
.b.lic{background:transparent;border:1px solid var(--border)}
/* yours */
.group{margin-bottom:28px}
.group h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.row{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:10px;cursor:pointer}
.row:hover{border-color:#cfcbc2}
.row .ic{width:42px;height:42px;border-radius:10px}
.row .ic svg{width:20px;height:20px}
.rb{flex:1;min-width:0}
.rt{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rd{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.surf{display:flex;gap:10px;align-items:center;flex:none}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.tg{width:34px;height:20px;border-radius:20px;background:#d6d3cb;position:relative;border:0;padding:0;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--accent)}
.tg.on::after{left:16px}
.tg[disabled]{opacity:.55;cursor:not-allowed}
.kb{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.kb:hover{background:var(--hover)}
.empty{background:#efede8;border-radius:18px;padding:30px 30px;display:flex;align-items:center;gap:20px}
.empty h3{margin:0 0 6px;font-size:19px}
.empty p{margin:0 0 18px;color:var(--muted);font-size:16px}
.empty .art{margin-left:auto;width:90px;height:90px;flex:none;color:#2a2926}
.empty .acts{display:flex;gap:16px;align-items:center}
/* detail */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}
.dh{display:flex;gap:18px;align-items:center;margin-bottom:28px}
.dh .ic{width:64px;height:64px;border-radius:14px}
.dh .ic svg{width:28px;height:28px}
.dh h2{margin:0;font-size:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta{color:var(--muted);margin-top:4px}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
.dtab{background:none;border:0;padding:10px 16px;color:var(--muted);font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtab.on{color:var(--text);font-weight:600;border-color:var(--text)}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px}
.lab2{color:var(--muted);font-size:14px;margin:0 0 8px}
.desc{font-size:16.5px;line-height:1.6;margin:0 0 26px;max-width:760px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{background:var(--hover);border:0;border-radius:8px;padding:5px 12px;font-size:14px}
.chip:hover{background:#e2dfd7}
.side{background:#f3f1ec;border-radius:14px;padding:18px;align-self:start}
.side h5{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:500}
.risk{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:14.5px}
.risk .ri{width:26px;height:26px;border-radius:7px;background:#e6e3dc;display:grid;place-items:center;flex:none}
.risk .ri svg{width:15px;height:15px}
.conn{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border);font-size:14.5px}
.conn .cn{flex:1;min-width:0}
.conn .cs{font-size:12.5px;color:var(--muted)}
.small{font-size:13px;padding:5px 10px;border-radius:8px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;margin-bottom:26px;font-size:15px}
.kv div:nth-child(odd){color:var(--muted)}
.list{border:1px solid var(--border);border-radius:var(--r);background:var(--panel)}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.li .n{font-weight:600}
.li .d{color:var(--muted);font-size:14px}
pre{background:#1f1e1c;color:#ece9e2;border-radius:12px;padding:16px 18px;overflow:auto;font-size:13px;line-height:1.55}
.tree{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.stage{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--border)}
.stage:first-child{border-top:0}
.stage .n{flex:1}
.banner{border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warnbg);color:#6b4a00}
.banner.bad{background:var(--badbg);color:#7a1810}
/* popover / modal / toast */
.pop{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:8px;z-index:50;min-width:230px}
.pop .pi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;font-size:14.5px}
.pop .pi:hover{background:var(--hover)}
.pop .ph{font-size:12px;color:var(--muted);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.05em}
.pop label{display:flex;gap:9px;align-items:center;padding:6px 10px;font-size:14.5px;cursor:pointer;border-radius:8px}
.pop label:hover{background:var(--hover)}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.pop .adm{margin-left:auto;font-size:11px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(20,20,18,.35);display:grid;place-items:center;z-index:60}
.modal{background:var(--panel);border-radius:16px;width:min(520px,92vw);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{margin:0 0 4px;font-size:20px}
.modal .sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt:hover{background:#faf9f6}
.opt input{margin-top:3px}
.opt .d{color:var(--muted);font-size:13.5px}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14.5px}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--border);margin:4px 0 8px 26px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:70}
.t{background:var(--text);color:#fff;border-radius:10px;padding:11px 16px;display:flex;gap:16px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14.5px}
.t button{background:none;border:0;color:#9fd3bf;font-weight:600}
.note{font-size:12.5px;color:var(--muted);background:#f3f1ec;border-radius:8px;padding:8px 10px;margin-top:12px}
@media (max-width:1050px){.dbody{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
@media (max-width:780px){.sb{display:none}main{padding:28px 18px}.surf .sw span{display:none}.hero .art{display:none}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- helpers ---------- */
function badges(i, full){
  let h = `<span class="b ${i.trust}">${TRUST[i.trust]}</span>`;
  if(i.status==='blocked') h += `<span class="b bad">Blocked</span>`;
  else h += `<span class="b lic">${i.lic}</span>`;
  if(i.status==='warn') h += `<span class="b warn">Warning</span>`;
  if(i.desktop) h += `<span class="b">Desktop only</span>`;
  return h;
}
function yours(t){
  const own = ITEMS.filter(i=>i.type===t && i.installed);
  if(t!=='skills') return own;
  const fromPlugins = [];
  ITEMS.filter(p=>p.type==='plugins' && p.installed).forEach(p=>{
    (p.skills||[]).forEach(n=>fromPlugins.push({id:p.id+'::'+n,virtual:true,type:'skills',name:n,icon:'bolt',pub:p.pub,trust:p.trust,lic:p.lic,
      desc:`Included with the ${p.name} plugin.`,fromPlugin:p,origin:'plugin',status:'ok',surfaces:p.surfaces,enabled:p.enabled,installed:true}));
  });
  return own.concat(fromPlugins);
}
function filtered(){
  let l = ITEMS.filter(i=>i.type===S.type);
  const q = S.q.trim().toLowerCase();
  if(q) l = l.filter(i=>(i.name+' '+i.desc+' '+i.pub+' '+i.cats.join(' ')).toLowerCase().includes(q));
  if(S.cats.size) l = l.filter(i=>i.cats.some(c=>S.cats.has(c)));
  if(S.trust.size) l = l.filter(i=>S.trust.has(i.trust));
  const order = {builtin:0,verified:1,org:2,community:3};
  if(S.sort==='name') l.sort((a,b)=>a.name.localeCompare(b.name));
  else if(S.sort==='newest') l.sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0));
  else l.sort((a,b)=>(order[a.trust]-order[b.trust]) || (b.featured?1:0)-(a.featured?1:0));
  return l;
}

  return `<h1>Customize</h1>
  <div class="bar">

    <div class="vsep"></div>
    <div class="seg"><button class="${S.view==='yours'?'on':''}" onclick="setView('yours')">Yours</button><button class="${S.view==='discover'?'on':''}" onclick="setView('discover')">Discover</button></div>
    <div class="grow"></div>
    <label class="search">${ic('search')}<input id="q" value="${esc(S.q)}" placeholder="Search skills, plugins and connectors" oninput="onSearch(this.value)"></label>
    <button class="ib" title="Filter" onclick="filterPop(this)">${ic('filter')}${nf?'<span class="dot"></span>':''}</button>

  </div>`;
}
function card(i){
  let btn;

  else if(i.installed) btn = `<button class="plus done" title="Added" onclick="event.stopPropagation();openDetail('${i.id}')">✓</button>`;
  else btn = `<button class="plus" title="Quick add for me" onclick="quickAdd(event,'${i.id}')">+</button>`;
  return `<div class="card" onclick="openDetail('${i.id}')">
    <div class="ic">${ic(i.icon)}</div>
    <div class="cb"><div class="ct">${esc(i.name)} ${i.isNew?'<span class="b new">New</span>':''}</div>
      <div class="cd">${esc(i.desc)}</div>
      <div class="cm">by ${esc(i.pub)} ${badges(i)}</div></div>${btn}</div>`;
}
function discover(){
  const l = filtered();
  const [plural] = TYPES[S.type];
  if(S.q || S.cats.size || S.trust.size){
    return `<div class="sh"><h3>${l.length} result${l.length===1?'':'s'}</h3><button class="link" onclick="clearFilters()">Clear filters</button></div>
      ${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p style="color:var(--muted)">No ${plural.toLowerCase()} match. Try another search or category.</p>`}`;
  }
  const hero = ITEMS.find(i=>i.featured) ;
  let h = '';
  if(hero){
    h += `<div class="hero"><div><div class="lab">Featured from ainxt</div><h2>${esc(hero.name)}</h2><p>${esc(hero.desc)}</p>
      <button class="primary" onclick="${hero.installed?`openDetail('${hero.id}')`:`openAdd('${hero.id}')`}">${hero.installed?'Open':'Add'}</button></div>
      <svg class="art" viewBox="0 0 150 110" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="6" y="10" width="96" height="70" rx="4"/><path d="M6 30h96M6 50h96M38 10v70M70 10v70"/><circle cx="108" cy="72" r="30" fill="#bcd6c9"/><path d="M92 78l10-10 8 6 14-14M116 60h8v8"/></svg></div>`;
  }
  const news = l.filter(i=>i.isNew);
  if(news.length) h += `<div class="sh"><h3>New ${plural.toLowerCase()}</h3><button class="link" onclick="showCat(null,true)">Show all →</button></div><div class="grid">${news.slice(0,4).map(card).join('')}</div>`;
  const cats = [...new Set(l.flatMap(i=>i.cats))].slice(0,5);
  cats.forEach(c=>{
    const inC = l.filter(i=>i.cats.includes(c));
    h += `<div class="sh"><h3>${esc(c)}</h3><button class="link" onclick="showCat('${esc(c)}')">Show all →</button></div><div class="grid">${inC.slice(0,4).map(card).join('')}</div>`;
  });
  return h;
}
function statusChip(i){
  if(i.status==='blocked') return `<span class="b bad" title="${esc(i.reason)}">Blocked</span>`;
  if(i.conn){
    const m={connected:['ok','Connected'],needs_reauth:['warn','Needs sign-in'],none:['','Not connected'],connecting:['','Connecting…'],error:['bad','Error']}[i.conn.state]||['','—'];
    if(i.desktop) return `<span class="b">Desktop only</span>`;
    return `<span class="b ${m[0]}">${m[1]}</span>`;
  }
  if(i.status==='warn') return `<span class="b warn">Warning</span>`;
  return i.enabled?`<span class="b ok">Active</span>`:`<span class="b">Disabled</span>`;
}
function row(i){
  const locked = i.required;

  }).join('');
  const tag = i.fromPlugin?`<span class="b" onclick="event.stopPropagation();openDetail('${i.fromPlugin.id}')" style="cursor:pointer">from ${esc(i.fromPlugin.name)}</span>`:'';
  return `<div class="row" onclick="${i.virtual?`openDetail('${i.fromPlugin.id}')`:`openDetail('${i.id}')`}">

## Verification
…</pre>`;
    case 'skills': return `<div class="list">${i.skills.map(s=>`<div class="li"><div class="ic" style="width:34px;height:34px;border-radius:8px">${ic('bolt').replace('<svg','<svg style="width:16px;height:16px"')}</div><div><div class="n">${esc(s)}</div><div class="d">Appears in chat as /${s.toLowerCase().replace(/[^a-z0-9]+/g,'-')} · tagged “from ${esc(i.name)}”</div></div></div>`).join('')}</div>`;
    case 'commands': return `<div class="list">${i.commands.map(c=>`<div class="li"><div class="n" style="font-family:ui-monospace,Menlo,monospace">${c}</div></div>`).join('')}</div>`;
    case 'connectors': return `<div class="list">${i.conns.map(c=>`<div class="li"><div class="ic" style="width:34px;height:34px;border-radius:8px">${ic('plug').replace('<svg','<svg style="width:16px;height:16px"')}</div><div><div class="n">${esc(c.name)}</div><div class="d">${esc(c.auth)}</div></div></div>`).join('')}</div>`;
    case 'tools': return toolsList(i.tools);
    case 'versions': return `<div class="list">
      <div class="li"><div style="flex:1"><div class="n">v${i.ver} <span class="b ok">Current</span></div><div class="d">Updated ${i.upd} · verified</div></div></div>
      <div class="li"><div style="flex:1"><div class="n">v${prevVer(i.ver)}</div><div class="d">Previous · verified</div></div>${i.installed?`<button class="ghost small" onclick="toast('Rolled back ${esc(i.name)} to v${prevVer(i.ver)} (mock)')">Roll back</button>`:''}</div></div>`;
    case 'verification': {
      const st = [['Manifest & structure','pass'],['License (MIT / Apache-2.0 only)',i.status==='blocked'?'fail':'pass'],['Safety scan',i.status==='warn'?'warn':'pass'],
        ['Supply chain','pass'],['Sandbox run','pass'],['Ethics & policy','pass']];
      if(i.type==='mcp'||i.type==='connectors'||i.type==='plugins') st.push(['Connection & tool annotations',i.status==='warn'&&i.type==='mcp'?'warn':'pass']);
      const lab={pass:['ok','Passed'],warn:['warn','Warning'],fail:['bad','Blocked']};
      return `${i.status==='warn'?`<div class="banner warn">${ic('info')}<div><b>Passed with a warning.</b> ${esc(i.finding)}</div></div>`:''}
        ${i.status==='blocked'?`<div class="banner bad">${ic('info')}<div><b>Blocked.</b> ${esc(i.reason)}</div></div>`:''}
        <div class="list">${st.map(([n,s])=>`<div class="stage"><div class="n">${n}</div><span class="b ${lab[s][0]}">${lab[s][1]}</span></div>`).join('')}</div>
        <p class="lab2" style="margin-top:12px">Automated checks · scanner v2026.09 · checked ${i.upd}</p>`;
    }
    case 'license':
      return `<div class="kv"><div>License</div><div>${i.lic}</div><div>Copyright</div><div>© 2026 ${esc(i.pub)}</div><div>Source</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:13.5px">github.com/${esc(i.pub.toLowerCase().replace(/\s+/g,'-'))}/${i.id} @ 695f747</div></div>
      <pre>${i.lic==='MIT'?`MIT License\n\nCopyright (c) 2026 ${esc(i.pub)}\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software ... (full text shown here)`:`Apache License, Version 2.0\n\nCopyright 2026 ${esc(i.pub)}\n\n(full license text and NOTICE shown here)`}</pre>`;
  }
  return '';
}
function prevVer(v){const p=v.split('.').map(Number);if(p[2]>0)p[2]--;else if(p[1]>0)p[1]--;return p.join('.');}
function renderDetail(){
  const i = get(S.detail);
  const [plural] = TYPES[i.type];
  let action;
  if(i.status==='blocked') action = `<button class="primary" disabled title="${esc(i.reason)}">Blocked</button>`;
  else if(i.installed) action = `<button class="ghost" onclick="installedPop(this,'${i.id}')">Installed ${ic('down',2).replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px"')}</button>`;
  else action = `<button class="primary" onclick="openAdd('${i.id}')">Add</button>`;
  const meta = [`by ${esc(i.pub)}`, i.ver, i.skills?`${i.skills.length} skills`:null, `updated ${i.upd}`].filter(Boolean).join(' · ');
  document.getElementById('main').innerHTML = `
    <div class="top"><button class="link" onclick="back()">${ic('back').replace('<svg','<svg style="width:18px;height:18px"')} ${plural}</button>
      <button class="link" onclick="copyLink('${i.id}')">${ic('link').replace('<svg','<svg style="width:18px;height:18px"')} Copy link</button></div>
    ${i.status==='blocked'?`<div class="banner bad">${ic('info')}<div><b>This item can't be added.</b> ${esc(i.reason)}</div></div>`:''}
    <div class="dh"><div class="ic">${ic(i.icon)}</div>
      <div style="flex:1"><h2>${esc(i.name)} ${i.isNew?'<span class="b new">New</span>':''} ${badges(i)}</h2><div class="meta">${meta}</div></div>${action}</div>
    <div class="dtabs">${tabsFor(i).map(([k,l])=>`<button class="dtab ${S.dtab===k?'on':''}" onclick="S.dtab='${k}';render()">${l}</button>`).join('')}</div>
    <div class="dbody"><div>${tabBody(i)}</div>${side(i)}</div>`;
}

/* ---------- actions ---------- */
function render(){ closePop(); S.detail?renderDetail():renderList(); }
function goHome(){ S.detail=null; render(); }
function setType(t){ S.type=t; S.detail=null; S.q=''; S.cats.clear(); S.trust.clear(); S.view = yours(t).length?'yours':'discover'; render(); }
function setView(v){ S.view=v; S.detail=null; render(); }
let qt; function onSearch(v){ S.q=v; clearTimeout(qt); qt=setTimeout(()=>{render(); const q=document.getElementById('q'); q.focus(); q.setSelectionRange(v.length,v.length);},200); }
function clearFilters(){ S.q=''; S.cats.clear(); S.trust.clear(); render(); }
function showCat(c,newOnly){ S.detail=null; S.view='discover'; S.cats.clear(); if(c) S.cats.add(c); if(newOnly){S.sort='newest';} render(); window.scrollTo(0,0); }
function openDetail(id){ S.detail=id; S.dtab='overview'; render(); window.scrollTo(0,0); }
function back(){ S.detail=null; render(); }
function quickAdd(e,id){
  e.stopPropagation(); const i=get(id);
  i.installed=true; i.origin='added';
  render(); toast(`${i.name} added for you · available in Chat, Agent Studio and Cowork`, ()=>{i.installed=false; render();});
}
function install(id){
  const i=get(id); const scope=(document.querySelector('input[name=scope]:checked')||{}).value||'me';
  ['chat','studio','cowork','desktop'].forEach(s=>{ const cb=document.getElementById('sf-'+s); if(cb) i.surfaces[s]=cb.checked; });
  i.installed=true; i.origin = scope==='me'?'added':'provisioned';
  closeModal(); render();
  toast(`${i.name} added ${scope==='me'?'for you':scope==='group'?'for Platform Team':'for Acme Org'} · menus updated everywhere`);
}
function uninstall(id){ const i=get(id); if(i.required){toast('Required by your admin. It can’t be removed.');return;} i.installed=false; if(i.conn&&i.conn.state==='connected') i.conn={state:'none'}; render(); toast(`${i.name} removed · gone from chat and all surfaces`, ()=>{i.installed=true;render();}); }
function toggleEnabled(id){ const i=get(id); i.enabled=!i.enabled; render(); toast(`${i.name} ${i.enabled?'enabled':'disabled'} everywhere`); }
function toggleSurface(id,s){ const i=get(id); if(!i||i.required) return; i.enabled=true; i.surfaces[s]=!i.surfaces[s]; render(); toast(`${i.name}: ${s==='studio'?'Agent Studio':s[0].toUpperCase()+s.slice(1)} ${i.surfaces[s]?'on':'off'}`); }
function connect(id){
  const i=get(id);
  if(i.type==='plugins'){ i._conn={state:'connecting'}; render(); setTimeout(()=>{i._conn={state:'connected',account:'adarsh@acme.com'}; render(); toast('Connected as adarsh@acme.com');},1400); toast('Opening provider sign-in in your browser…'); return; }
  i.conn={state:'connecting'}; render(); toast('Opening provider sign-in in your browser…');
  setTimeout(()=>{ i.conn={state:'connected',account:'adarsh@acme.com'}; if(!i.installed){i.installed=true;i.origin='added';} render(); toast(`${i.name} connected as adarsh@acme.com`); },1400);
}
function disconnect(id){ const i=get(id); if(i.type==='plugins') i._conn={state:'none'}; else i.conn={state:'none'}; render(); toast('Disconnected · access revoked at the provider'); }
function copyLink(id){ const i=get(id); const url=`${location.origin}/customize/${i.type}/id/${i.pub.toLowerCase().replace(/\s+/g,'-')}/${i.id}`; try{navigator.clipboard.writeText(url);}catch(e){} toast('Link copied'); }

/* ---------- popovers ---------- */
function showPop(el, html){
  const p=document.getElementById('pop'); const r=el.getBoundingClientRect();
  p.innerHTML=`<div class="pop" style="top:${r.bottom+window.scrollY+6}px;left:${Math.max(8,Math.min(r.right-240, window.innerWidth-260))+window.scrollX}px">${html}</div>`;
  setTimeout(()=>document.addEventListener('click',outside),0);
}
function outside(e){ if(!e.target.closest('.pop')) closePop(); }
function closePop(){ document.getElementById('pop').innerHTML=''; document.removeEventListener('click',outside); }
function addPop(el){
  const it=(i,t,a)=>`<button class="pi" onclick="closePop();toast('${a}')">${ic(i).replace('<svg','<svg style="width:17px;height:17px"')}${t}</button>`;
  showPop(el, `${it('bolt','Create with AI','Mock: opens a chat that drafts the skill, then a preview card')}
    ${it('pen','Write a skill','Mock: opens the SKILL.md editor')}
    ${it('doc','Upload (.zip)','Mock: file picker, then automated checks')}
    ${it('code','Import from GitHub / URL','Mock: paste a repo path or URL')}
    ${it('plug','Add MCP server','Mock: URL or config form')}
    ${it('chat','Add connector','Mock: pick a connector, then sign in')}
    <hr><div class="ph">Admin</div>
    ${it('globe','Add source <span class=adm>admin</span>','Mock: admin source allowlist')}
    ${it('shield','Provision for org <span class=adm>admin</span>','Mock: provision to org or groups')}`);
}
function filterPop(el){
  const cats=[...new Set(ITEMS.filter(i=>i.type===S.type).flatMap(i=>i.cats))];
  showPop(el, `<div class="ph">Category</div>${cats.map(c=>`<label><input type="checkbox" ${S.cats.has(c)?'checked':''} onchange="tog(S.cats,'${esc(c)}')"> ${esc(c)}</label>`).join('')}
    <hr><div class="ph">Publisher</div>${Object.keys(TRUST).map(t=>`<label><input type="checkbox" ${S.trust.has(t)?'checked':''} onchange="tog(S.trust,'${t}')"> ${TRUST[t]}</label>`).join('')}`);
}
function tog(set,v){ set.has(v)?set.delete(v):set.add(v); S.view='discover'; const p=document.getElementById('pop').innerHTML; document.getElementById('main').innerHTML = header()+discover(); document.getElementById('pop').innerHTML=p; }
function sortPop(el){
  const o=[['featured','Featured'],['newest','Newest'],['updated','Recently updated'],['name','Name']];
  showPop(el, o.map(([k,l])=>`<button class="pi" onclick="S.sort='${k}';render()">${S.sort===k?'✓':'&nbsp;&nbsp;'} ${l}</button>`).join('') + `<div class="note">Ranking never uses raw install count.</div>`);
}
function rowMenu(el,id){
  if(id.includes('::')){ const pid=id.split('::')[0]; showPop(el,`<button class="pi" onclick="openDetail('${pid}')">Open plugin</button>`); return; }
  const i=get(id);
  showPop(el, `<button class="pi" onclick="openDetail('${id}')">Open details</button>
    ${i.origin==='created'?`<button class="pi" onclick="closePop();toast('Mock: opens editor; saving creates a new version and re-runs checks')">Edit / New version</button><button class="pi" onclick="closePop();toast('Mock: share with people or groups')">Share</button>`:''}
    <button class="pi" onclick="toggleEnabled('${id}')">${i.enabled?'Disable everywhere':'Enable'}</button>
    <button class="pi" onclick="S.detail='${id}';S.dtab='verification';render()">View checks</button>
    <hr><button class="pi" style="color:var(--bad)" onclick="uninstall('${id}')">${i.required?'Required (can’t remove)':'Uninstall'}</button>`);
}
function installedPop(el,id){
  const i=get(id);
  showPop(el, `<button class="pi" onclick="S.view='yours';S.type='${i.type}';S.detail=null;render()">Manage in Yours</button>
    <button class="pi" onclick="toggleEnabled('${id}')">${i.enabled?'Disable':'Enable'}</button>
    <button class="pi" onclick="S.dtab='versions';render()">Versions & rollback</button>
    <hr><button class="pi" style="color:var(--bad)" onclick="uninstall('${id}')">${i.required?'Required (can’t remove)':'Uninstall'}</button>`);
}

/* ---------- modal ---------- */
function openAdd(id){
  const i=get(id);
  const needs = i.conns||(i.conn&&i.conn.state!=='connected'?[{name:i.name,auth:i.auth}]:[]);
  document.getElementById('modal').innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">
    <h3>Add ${esc(i.name)}</h3><p class="sub">${TRUST[i.trust]} · ${i.lic} · automated checks ${i.status==='warn'?'passed with a warning':'passed'}</p>
    <div class="lab2">Who gets it</div>
    <label class="opt"><input type="radio" name="scope" value="me" checked onchange="grp(false)"><div><div>Just me</div><div class="d">Only you see it in chat and your agents.</div></div></label>
    <label class="opt"><input type="radio" name="scope" value="group" onchange="grp(true)"><div><div>A group</div><div class="d">Members of the selected group get it. Needs share permission.</div>
      <select id="grpsel" style="display:none;margin-left:0"><option>Platform Team</option><option>Marketing</option><option>Support</option></select></div></label>
    <label class="opt"><input type="radio" name="scope" value="org" onchange="grp(false)"><div><div>Everyone in Acme Org</div><div class="d">Admins only. Can be default-on or required.</div></div></label>
    <div class="lab2" style="margin-top:14px">Available in</div>
    <div class="checks">${['chat','studio','cowork','desktop'].map(s=>`<label><input type="checkbox" id="sf-${s}" checked> ${{chat:'Chat',studio:'Agent Studio',cowork:'Cowork',desktop:'Desktop'}[s]}</label>`).join('')}</div>
    ${needs.length?`<div class="lab2">Sign-in needed</div>${needs.map(c=>`<div class="conn" style="border:0;padding:4px 0"><div class="cn"><div>${esc(c.name)}</div><div class="cs">${esc(c.auth)} · you can connect now or on first use</div></div></div>`).join('')}`:''}
    ${i.status==='warn'?`<div class="banner warn" style="margin-top:10px">${ic('info')}<div>${esc(i.finding)}</div></div>`:''}
    <div class="mf"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="install('${id}')">Add</button></div></div></div>`;
}
function grp(show){ document.getElementById('grpsel').style.display=show?'block':'none'; }
function closeModal(){ document.getElementById('modal').innerHTML=''; }

/* ---------- toast ---------- */
let tt;
function toast(msg, undo){
  const t=document.getElementById('toast');
  window._undo = undo;
  t.innerHTML = `<div class="t">${msg}${undo?`<button onclick="window._undo&&window._undo();document.getElementById('toast').innerHTML=''">Undo</button>`:''}</div>`;
  clearTimeout(tt); tt=setTimeout(()=>t.innerHTML='',3800);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePop(); closeModal(); } });

render();
</script>
</body>
</html>
